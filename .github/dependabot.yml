# Dependabot: once a week, checks the npm libraries M.O.R.P.H.A. uses for
# known security holes and newer versions, and opens a pull request to update
# each (nothing changes until it is merged). Security alerts themselves are
# switched on in the repository's Settings -> Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Small updates together, so the list stays short.
      minor-and-patch:
        update-types: [minor, patch]
